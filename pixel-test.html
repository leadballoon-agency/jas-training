<!DOCTYPE html>
<html>
<head>
    <title>Pixel Test</title>
</head>
<body>
    <h1>Facebook Pixel Test Page</h1>
    <p>Check the console and Facebook Pixel Helper</p>

    <!-- Facebook Pixel Code -->
    <script>
        console.log('Starting Facebook Pixel initialization...');

        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');

        fbq('init', '1279358166934984');
        fbq('track', 'PageView');

        console.log('Facebook Pixel commands sent');

        // Debug after load
        window.addEventListener('load', function() {
            console.log('Page loaded. Checking fbq object:');
            console.log('fbq exists?', typeof fbq !== 'undefined');
            if (typeof fbq !== 'undefined') {
                console.log('fbq object:', fbq);
                console.log('Attempting to fire test event...');
                fbq('track', 'ViewContent', {test: true});
            }
        });
    </script>
    <noscript>
        <img height="1" width="1" style="display:none"
        src="https://www.facebook.com/tr?id=1279358166934984&ev=PageView&noscript=1"/>
    </noscript>
    <!-- End Facebook Pixel Code -->
</body>
</html>
